<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Louis Lizzadro{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-50 min-h-screen flex flex-col">

    <nav class="bg-white dark:bg-neutral-800 dark:border-neutral-700 border-b border-neutral-200">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="font-bold text-neutral-900 dark:text-neutral-100 hover:text-purple-600 dark:hover:text-purple-600 transition-colors">
                Louis Lizzadro
            </a>
            <div class="flex gap-6 text-sm font-medium text-neutral-600 dark:text-neutral-400">
                <a href="/" class="hover:text-purple-600 transition-colors">Home</a>
                <a href="/guestbook" class="hover:text-purple-600 transition-colors">Guestbook</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-3xl mx-auto px-6 py-12 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 mt-auto">
        <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between text-sm text-neutral-500 dark:text-neutral-400">
            <span>&copy; 2026 Louis Lizzadro</span>
            <div class="flex gap-5">
                <a href="https://github.com/lllizzadro" target="_blank" rel="noopener noreferrer"
                   class="hover:text-purple-600 transition-colors">GitHub</a>
                <a href="https://www.linkedin.com/in/louis-lizzadro/" target="_blank" rel="noopener noreferrer"
                   class="hover:text-purple-600 transition-colors">LinkedIn</a>
            </div>
        </div>
    </footer>

</body>
</html>
