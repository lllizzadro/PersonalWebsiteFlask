<!DOCTYPE html>
<html lang="en">
<head>
    <script>document.documentElement.classList.add('js');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Louis Lizzadro{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta name="description" content="{% block meta_description %}Louis Lizzadro — software developer in Nashville. Projects, guestbook, and résumé.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:url" content="{{ request.base_url }}">
    <meta property="og:image" content="{{ url_for('static', filename='og-image.jpg', _external=True) }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['Space Mono', 'monospace'],
        } } }
      }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="text-neutral-50 min-h-screen flex flex-col">

    <nav class="relative bg-white/5 backdrop-blur-sm backdrop-saturate-150 border-b border-white/20">
        <div class="{% block main_width %}max-w-3xl{% endblock %} mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-mono font-bold text-neutral-100 hover:text-purple-600 transition-colors">
                <span class="text-purple-600">&lt;/&gt;</span>
                Louis Lizzadro
            </a>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-sm font-medium font-mono text-neutral-400">
                    <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %} class="nav-link hover:text-purple-600 transition-colors">Home</a>
                    <a href="/guestbook" {% if request.path == '/guestbook' %}aria-current="page"{% endif %} class="nav-link hover:text-purple-600 transition-colors">Guestbook</a>
                    <a href="/resume" {% if request.path == '/resume' %}aria-current="page"{% endif %} class="nav-link hover:text-purple-600 transition-colors">Resume</a>
                </div>
                <button id="nav-toggle" aria-label="Toggle menu" class="md:hidden text-neutral-400 hover:text-purple-600 transition-colors">☰</button>
            </div>
        </div>
        <div id="mobile-menu" class="md:hidden px-6 space-y-1 text-lg font-medium font-mono text-neutral-400">
            <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %} class="block hover:text-purple-600 transition-colors">Home</a>
            <a href="/guestbook" {% if request.path == '/guestbook' %}aria-current="page"{% endif %} class="block hover:text-purple-600 transition-colors">Guestbook</a>
            <a href="/resume" {% if request.path == '/resume' %}aria-current="page"{% endif %} class="block hover:text-purple-600 transition-colors">Resume</a>
        </div>
    </nav>

    <main class="flex-1 {{ self.main_width() }} mx-auto px-6 py-12 w-full">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                        <div class="rounded-lg border border-red-400/30 bg-red-500/10 backdrop-blur-sm px-4 py-3 text-sm text-red-200">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-white/20 bg-white/5 backdrop-blur-sm backdrop-saturate-150 mt-auto">
        <div class="{{ self.main_width() }} mx-auto px-6 py-5 flex items-center justify-between text-sm text-neutral-400">
            <span>&copy; 2026 Louis Lizzadro</span>
            <div class="flex gap-5">
                <a href="https://github.com/lllizzadro" target="_blank" rel="noopener noreferrer"
                   class="hover:text-purple-600 transition-colors">GitHub</a>
                <a href="https://www.linkedin.com/in/louis-lizzadro/" target="_blank" rel="noopener noreferrer"
                   class="hover:text-purple-600 transition-colors">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/reveal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
</body>
</html>
