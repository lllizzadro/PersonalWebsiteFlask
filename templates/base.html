<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Louis Lizzadro{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['Space Mono', 'monospace'],
        } } }
      }
    </script>
    <style>
      h1, h2, h3 { font-family: 'Space Mono', monospace; }
    </style>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      </script>
</head>
<body class="bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-50 min-h-screen flex flex-col">

    <nav class="relative bg-white dark:bg-neutral-800 dark:border-neutral-700 border-b border-neutral-200">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="font-mono font-bold text-neutral-900 dark:text-neutral-100 hover:text-purple-600 dark:hover:text-purple-600 transition-colors">
                Louis Lizzadro
            </a>
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-sm font-medium font-mono text-neutral-600 dark:text-neutral-400">
                    <a href="/" class="hover:text-purple-600 transition-colors {% if request.path == '/' %}text-purple-600{% endif %}">Home</a>
                    <a href="/guestbook" class="hover:text-purple-600 transition-colors {% if request.path == '/guestbook' %}text-purple-600{% endif %}">Guestbook</a>
                    <a href="/resume" class="hover:text-purple-600 transition-colors {% if request.path == '/resume' %}text-purple-600{% endif %}">Resume</a>
                </div>
                <button id="theme-toggle" aria-label="Toggle dark mode" class="text-neutral-600 dark:text-neutral-400 hover:text-purple-600 transition-colors">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
                <button id="nav-toggle" aria-label="Toggle menu" class="md:hidden text-neutral-600 dark:text-neutral-400 hover:text-purple-600 transition-colors">☰</button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden absolute right-1 top-full mt-1 w-40 z-50 bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg shadow-lg p-2 space-y-1 text-lg font-medium font-mono text-neutral-600 dark:text-neutral-400">
            <a href="/" class="block hover:text-purple-600 transition-colors {% if request.path == '/' %}text-purple-600{% endif %}">Home</a>
            <a href="/guestbook" class="block hover:text-purple-600 transition-colors {% if request.path == '/guestbook' %}text-purple-600{% endif %}">Guestbook</a>
            <a href="/resume" class="block hover:text-purple-600 transition-colors {% if request.path == '/resume' %}text-purple-600{% endif %}">Resume</a>
        </div>
    </nav>

    <main class="flex-1 max-w-3xl mx-auto px-6 py-12 w-full">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 mt-auto">
        <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between text-sm text-neutral-500 dark:text-neutral-400">
            <span>&copy; 2026 Louis Lizzadro</span>
            <div class="flex gap-5">
                <a href="https://github.com/lllizzadro" target="_blank" rel="noopener noreferrer"
                   class="hover:text-purple-600 transition-colors">GitHub</a>
                <a href="https://www.linkedin.com/in/louis-lizzadro/" target="_blank" rel="noopener noreferrer"
                   class="hover:text-purple-600 transition-colors">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
</body>
</html>
