{% extends "base.html" %}
{% block title %}Louis Lizzadro — Guestbook{% endblock %}

{% block content %}
<form method="POST" action="/guestbook">
    <input type="text" name="name" placeholder="Your Name" required>
    <textarea name="message" placeholder="Your Message" required></textarea>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md">Sign Guestbook</button>
</form>

<table class="w-full">
{% for entry in entries %}
<tr class="border-b border-slate-200">
    <td>{{ entry['name'] }}</td>
    <td>{{ entry['message'] }}</td>
    <td>{{ entry['timestamp'] }}</td>
</tr>
    {% endfor %}
</table>
{% endblock %}
