{% extends "base.html" %}
{% block title %}Louis Lizzadro — Guestbook{% endblock %}

{% block content %}
<form method="POST" action="/guestbook">
    <input type="text" name="name" placeholder="Your Name" required>
    <textarea name="message" placeholder="Your Message" required></textarea>
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors">Sign Guestbook</button>
</form>

<table class="w-full">
    <thead>
        <tr>
            <th>Name</th>
            <th>Message</th>
            <th>Timestamp</th>
        </tr>
    </thead>
        <tbody>
            {% for entry in entries %}
                <tr class="border-b border-slate-200">
                    <td>{{ entry['name'] }}</td>
                    <td>{{ entry['message'] }}</td>
                    <td>{{ entry['timestamp'] }}</td>
                </tr>
            {% endfor %}
        </tbody>
</table>
{% endblock %}
