{% extends "base.html" %}
{% block title %}Louis Lizzadro — Guestbook{% endblock %}

{% block content %}

<section class="mb-12">
    <h1 class="text-4xl font-bold text-purple-600 mb-3">Guestbook</h1>
    <p class="text-lg text-neutral-400 leading-relaxed">Drop a message for me.</p>
</section>

<form method="POST" action="/guestbook" class="w-full flex flex-col gap-3 mb-8">
    <input type="text" name="name" placeholder="Your Name" maxlength="50" class="w-full bg-white/5 backdrop-blur-sm backdrop-saturate-150 text-neutral-100 placeholder-neutral-400 border border-white/20 rounded-md p-3 text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500" required>
    <textarea name="message" placeholder="Your Message" maxlength="1000" class="w-full bg-white/5 backdrop-blur-sm backdrop-saturate-150 text-neutral-100 placeholder-neutral-400 border border-white/20 rounded-md p-3 text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500" required></textarea>
    <button type="submit" class="self-center bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition-colors">Sign Guestbook</button>
</form>

<h2 class="text-xl font-semibold text-neutral-200 mb-5">Messages</h2>

<div class="flex flex-col gap-4">
    {% for entry in entries %}
        <div class="bg-white/5 backdrop-blur-sm backdrop-saturate-150 border border-white/20 rounded-xl p-5 shadow-xl shadow-purple-950/30 hover:bg-white/10 hover:border-purple-400/60 transition-all">
            <div class="flex items-center justify-between mb-1">
                <span class="font-semibold text-neutral-100">{{ entry['name'] }}</span>
                <time datetime="{{ entry['timestamp'] | isodate }}" class="text-xs text-neutral-500">{{ entry['timestamp'] | prettydate }}</time>
            </div>
            <p class="text-sm text-neutral-400 leading-relaxed">{{ entry['message'] }}</p>
        </div>
    {% endfor %}
</div>


<script src="{{ url_for('static', filename='js/localtime.js') }}"></script>
{% endblock %}
