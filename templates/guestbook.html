{% extends "base.html" %}
{% block title %}Louis Lizzadro — Guestbook{% endblock %}

{% block content %}
<form method="POST" action="/guestbook" class="w-full flex flex-col gap-3 mb-8">
    <input type="text" name="name" placeholder="Your Name" class="w-full border border-slate-300 rounded-md p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
    <textarea name="message" placeholder="Your Message" class="w-full border border-slate-300 rounded-md p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required></textarea>
    <button type="submit" class=" self-center bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors">Sign Guestbook</button>
</form>

<div class="flex flex-col gap-4">
    {% for entry in entries %}
        <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all">
            <div class="flex items-center justify-between mb-1">
                <span class="font-semibold text-slate-900">{{ entry['name'] }}</span>
                <time datetime="{{ entry['timestamp'] | isodate }}" class="text-xs text-slate-400">{{ entry['timestamp'] | prettydate }}</time>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">{{ entry['message'] }}</p>
        </div>
    {% endfor %}
</div>


<script src="{{ url_for('static', filename='js/localtime.js') }}"></script>
{% endblock %}
