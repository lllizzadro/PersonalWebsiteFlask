{% extends "base.html" %}
{% block title %}Louis Lizzadro — Admin Login{% endblock %}

{% block content %}
<h1 class="text-4xl font-bold text-purple-600 mb-3">Admin Login</h1>
<form method="POST" action="{{ url_for('admin_login') }}" class="w-full flex flex-col gap-3 mb-8">
<input type="password" name="password" class="w-full bg-white/5 backdrop-blur-sm backdrop-saturate-150 text-neutral-100 placeholder-neutral-400 border border-white/20 rounded-md p-3 text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500" required>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit" class="self-center bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition-colors">Login</button>
</form>
{% endblock %}
